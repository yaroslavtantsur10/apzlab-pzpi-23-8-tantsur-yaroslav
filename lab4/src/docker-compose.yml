version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "ComfortSpace123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ComfortSpace123! -Q 'SELECT 1' -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api1:
    build: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ComfortSpace;User Id=sa;Password=ComfortSpace123!;TrustServerCertificate=True;
      - Jwt__Key=SUPER_SECRET_KEY_CHANGE_ME_32+_CHARS
      - Jwt__Issuer=ComfortSpace
      - Jwt__Audience=ComfortSpaceClient
    depends_on:
      sqlserver:
        condition: service_healthy

  api2:
    build: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ComfortSpace;User Id=sa;Password=ComfortSpace123!;TrustServerCertificate=True;
      - Jwt__Key=SUPER_SECRET_KEY_CHANGE_ME_32+_CHARS
      - Jwt__Issuer=ComfortSpace
      - Jwt__Audience=ComfortSpaceClient
    depends_on:
      sqlserver:
        condition: service_healthy

  api3:
    build: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ComfortSpace;User Id=sa;Password=ComfortSpace123!;TrustServerCertificate=True;
      - Jwt__Key=SUPER_SECRET_KEY_CHANGE_ME_32+_CHARS
      - Jwt__Issuer=ComfortSpace
      - Jwt__Audience=ComfortSpaceClient
    depends_on:
      sqlserver:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  sqldata: